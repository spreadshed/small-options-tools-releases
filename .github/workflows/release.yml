name: Create Release

# Creates the release for a tag, or updates its title and notes if it already exists.
# Title and notes come from release-notes/<tag>.md: the first line is the title
# (a "# " heading), the rest is the description. Attach the file to the release afterwards.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Version tag (e.g., tool01-v1.0)'
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag }}
        run: |
          if ! [[ "$TAG" =~ ^tool[0-9]{2}-v[0-9]+\.[0-9]+(\.[0-9]+)?$ ]]; then
            echo "::error::Tag must look like tool01-v1.0 or tool01-v1.0.1, got: $TAG"
            exit 1
          fi
          notes="release-notes/${TAG}.md"
          if [ ! -f "$notes" ]; then
            echo "::error::Missing $notes. Add the release notes first."
            exit 1
          fi
          title="$(head -n 1 "$notes" | sed 's/^#[[:space:]]*//')"
          tail -n +2 "$notes" > "$RUNNER_TEMP/body.md"
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release edit "$TAG" --title "$title" --notes-file "$RUNNER_TEMP/body.md"
            echo "Updated release $TAG"
          else
            gh release create "$TAG" --target "$GITHUB_SHA" --title "$title" --notes-file "$RUNNER_TEMP/body.md"
            echo "Created release $TAG. Now attach the file."
          fi
