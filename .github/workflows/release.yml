name: Create Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Version tag (e.g., tool01-v1.0)'
        required: true
        default: 'tool01-v1.0'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.event.inputs.tag }}" --generate-notes
